name: Publish Liliane to gh-pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-liliane-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liliane-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild exact Liliane V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/liliane-site/liliane-fortunato /tmp/liliane-parts

          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$out"
          }

          fetch_blob be895a947ae3756a269b97245b8f256cb5e62e8d /tmp/liliane-parts/g0.bin
          fetch_blob 7d0114cc8fbb106416c729fcebe182175ca8d1fd /tmp/liliane-parts/g1a.bin
          fetch_blob 51f8a76e3349f3bdebc24747eaaf398a8ca6601f /tmp/liliane-parts/g1b.bin
          fetch_blob 289d5ea77e92db2bb359906382a81d3aaf853991 /tmp/liliane-parts/g1c.bin
          fetch_blob 9ebd70238bc41bff34974f7e895e93edaafc7559 /tmp/liliane-parts/g2.bin

          cat /tmp/liliane-parts/g0.bin /tmp/liliane-parts/g1a.bin /tmp/liliane-parts/g1b.bin /tmp/liliane-parts/g1c.bin /tmp/liliane-parts/g2.bin > /tmp/liliane-v3.html.gz
          echo "545740331e543be2f3bf782ef82dea6b6d5042a2e8e431020e6e35deeebb725d  /tmp/liliane-v3.html.gz" | sha256sum -c -
          gzip -dc /tmp/liliane-v3.html.gz > /tmp/liliane-site/liliane-fortunato/index.html
          echo "db5fd21b67605c385416df65bcb00c8ea95b6f912b739f0750666fe2d12816c9  /tmp/liliane-site/liliane-fortunato/index.html" | sha256sum -c -
          cp /tmp/liliane-site/liliane-fortunato/index.html /tmp/liliane-site/index.html
          touch /tmp/liliane-site/.nojekyll

      - name: Push site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/liliane-site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Liliane Fortunato V3 at root"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
