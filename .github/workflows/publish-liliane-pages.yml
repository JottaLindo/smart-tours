name: Publish Liliane to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-liliane-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild exact Liliane V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/liliane-site/liliane-fortunato /tmp/liliane-parts

          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$out"
          }

          fetch_blob be895a947ae3756a269b97245b8f256cb5e62e8d /tmp/liliane-parts/g0.bin
          fetch_blob 7d0114cc8fbb106416c729fcebe182175ca8d1fd /tmp/liliane-parts/g1a.bin
          fetch_blob 51f8a76e3349f3bdebc24747eaaf398a8ca6601f /tmp/liliane-parts/g1b.bin
          fetch_blob 289d5ea77e92db2bb359906382a81d3aaf853991 /tmp/liliane-parts/g1c.bin
          fetch_blob 9ebd70238bc41bff34974f7e895e93edaafc7559 /tmp/liliane-parts/g2.bin

          echo "881bc9bbae4806649c2f61ed6743cdde1adacac99d0b456a60038dee3b8a9733  /tmp/liliane-parts/g0.bin" | sha256sum -c -
          echo "dc38fe3eb68935a1cda17e42681dc2094c445d5945e77bed46f3c01e86e11e4d  /tmp/liliane-parts/g1a.bin" | sha256sum -c -
          echo "288ba58429d1948edc7e66a109eb18fdad6872f42ed7c6b7d069b5629de0e834  /tmp/liliane-parts/g1b.bin" | sha256sum -c -
          echo "d45377a3fecbab4eab65828aa69ae640c37067bc9f3af7cb838bf830ac98a247  /tmp/liliane-parts/g1c.bin" | sha256sum -c -
          echo "f215aaa25e1859414d3c7bb2636fc0941c6e6f50116137ba87757e80177d39c7  /tmp/liliane-parts/g2.bin" | sha256sum -c -

          cat /tmp/liliane-parts/g0.bin /tmp/liliane-parts/g1a.bin /tmp/liliane-parts/g1b.bin /tmp/liliane-parts/g1c.bin /tmp/liliane-parts/g2.bin > /tmp/liliane-v3.html.gz
          echo "545740331e543be2f3bf782ef82dea6b6d5042a2e8e431020e6e35deeebb725d  /tmp/liliane-v3.html.gz" | sha256sum -c -

          gzip -dc /tmp/liliane-v3.html.gz > /tmp/liliane-site/liliane-fortunato/index.html
          echo "db5fd21b67605c385416df65bcb00c8ea95b6f912b739f0750666fe2d12816c9  /tmp/liliane-site/liliane-fortunato/index.html" | sha256sum -c -

          cat > /tmp/liliane-site/index.html <<'EOF'
          <!doctype html><html lang="pt"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./liliane-fortunato/"><title>Liliane Fortunato</title></head><body><a href="./liliane-fortunato/">Abrir Liliane Fortunato</a></body></html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/liliane-site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
