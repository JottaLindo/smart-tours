name: Publish Liliane to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-liliane-pages.yml'
      - 'demos/liliane-fortunato/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Measure valid prefix
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/prefix.bin
          : > "$OUT"
          cd demos/liliane-fortunato
          decode_one(){ tr -d '[:space:]' < "$1" | base64 --decode >> "$OUT"; }
          decode_one parts/part00.b64
          decode_one parts/part01.b64
          decode_one parts/part02.b64
          decode_one parts/part03.b64
          decode_one parts/part04.b64
          decode_one parts/part05.b64
          decode_one parts/part06.b64
          decode_one parts/part07.b64
          decode_one tail/p08_0.b64
          echo "VALID_PREFIX_BYTES=$(wc -c < "$OUT")"
          tail -c 80 "$OUT" | base64 | tr -d '\n' | sed 's/^/VALID_PREFIX_TAIL_B64=/'
          exit 1
