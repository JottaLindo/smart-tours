name: Build Liliane Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Liliane site
        shell: bash
        run: |
          set -euo pipefail
          cd demos/liliane-fortunato
          {
            cat parts/part00.b64
            cat parts/part01.b64
            cat parts/part02.b64
            cat parts/part03.b64
            cat parts/part04.b64
            cat parts/part05.b64
            cat parts/part06.b64
            cat parts/part07.b64
            cat tail/p08_0.b64 tail/p08_1.b64 tail/p08_2.b64 tail/p08_3.b64
            cat tail/p09_0.b64 tail/p09_1.b64 tail/p09_2.b64 tail/p09_3.b64
            cat tail/p10_0.b64 tail/p10_1.b64
          } | tr -d '[:space:]' | base64 --decode > index.html

          test -s index.html
          grep -q '<title>Liliane Fortunato' index.html
          grep -q '</html>' index.html

      - name: Commit generated page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demos/liliane-fortunato/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Liliane Fortunato demo'
            git push
          fi
