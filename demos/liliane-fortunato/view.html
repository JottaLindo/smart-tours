<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liliane Fortunato</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#201916;color:#f8f1e9;font-family:Inter,Arial,sans-serif}.wrap{text-align:center;padding:30px}.spinner{width:42px;height:42px;border:2px solid rgba(255,255,255,.18);border-top-color:#c97a68;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{opacity:.65;display:block;margin-top:8px}
</style>
</head>
<body>
<div class="wrap"><div class="spinner"></div><div>A abrir a apresentação da Liliane…</div><small>um momento</small></div>
<script>
(async()=>{
  const root='https://raw.githubusercontent.com/JottaLindo/smart-tours/main/demos/liliane-fortunato/';
  const files=[
    'parts/part00.b64','parts/part01.b64','parts/part02.b64','parts/part03.b64',
    'parts/part04.b64','parts/part05.b64','parts/part06.b64','parts/part07.b64',
    'tail/p08_0.b64','tail/p08_1.b64','tail/p08_2.b64','tail/p08_3.b64',
    'tail/p09_0.b64','tail/p09_1.b64','tail/p09_2.b64',
    'tail/p10_0.b64','tail/p10_1.b64'
  ];
  let b64='';
  for(const n of files){
    const r=await fetch(root+n,{cache:'no-store'});
    if(!r.ok) throw new Error(n+' '+r.status);
    b64+=(await r.text()).replace(/\s/g,'');
  }
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const html=new TextDecoder('utf-8').decode(bytes);
  if(!html.includes('<title>Liliane Fortunato') || !html.includes('</html>')) throw new Error('ficheiro final inválido');
  document.open(); document.write(html); document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="max-width:620px;padding:32px;text-align:center"><h1 style="font-family:Georgia,serif">Não foi possível abrir a demo.</h1><p>Erro: '+String(err)+'</p></div>';
});
</script>
</body>
</html>
